<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=240, height=320, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>About - TicTacToe</title>
<link rel="icon" href="icon-40.png" sizes="40x40" type="image/png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="app-header"><h1>About</h1></header>

  <main id="screens">
    <section class="screen active">
      <div class="about-box">
        <img class="about-icon" src="icon-80.png" alt="TicTacToe icon">
        <h2>TicTacToe for CloudPhone</h2>
        <p class="version">Version 2.0.0</p>
        <p class="developer">Developer - Tasmon Islam</p>
      </div>
    </section>
  </main>

  <footer id="softkey-bar">
    <span id="softkey-left" class="softkey" tabindex="-1"></span>
    <span id="softkey-center" class="softkey" tabindex="-1"></span>
    <span id="softkey-right" class="softkey" tabindex="-1">Back</span>
  </footer>
</div>

<script src="common.js"></script>
<script>
  (function () {
    var CP = window.CloudPhone;
    CP.applyTheme(CP.loadSettings().theme);
    CP.initSecondaryPageRSK('index.html');
  })();
</script>
</body>
</html>
